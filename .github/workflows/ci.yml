name: CI/CD Validation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python lint and validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    # Real PostgreSQL for tests/test_publish_swap.py; the tests create and drop
    # their own database (p1_publish_test) on it.
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: p1_test
          POSTGRES_PASSWORD: p1_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p1_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      P1_TEST_DATABASE_URL: postgresql://p1_test:p1_test@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Java (PySpark tests)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Ruff linting
        run: |
          ruff check .

      - name: Check Ruff formatting
        run: |
          ruff format --check .

      # Every test must run in CI: a skipped test fails the job. bash runs this
      # step with -eo pipefail, so a pytest failure isn't hidden by tee.
      - name: Run pytest validation (skips fail the job)
        shell: bash
        run: |
          pytest -q -rs | tee pytest-output.txt
          if tail -n 1 pytest-output.txt | grep -Eq '[0-9]+ skipped'; then
            echo "::error::pytest skipped tests; every test must run in CI (see the SKIPPED lines above)"
            exit 1
          fi

      # requirements-airflow.txt must resolve against Airflow's official 3.2.2
      # constraints for this job's Python. --dry-run installs nothing, so no other
      # step sees a different environment; a conflict fails the job.
      - name: Check Airflow requirements against the official constraints
        env:
          PYTHON_MINOR: ${{ matrix.python-version }}
        run: |
          pip install --dry-run --ignore-installed -r requirements-airflow.txt --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-${PYTHON_MINOR}.txt"

  docker-build:
    name: Docker image build validation (API and feature exporter)
    runs-on: ubuntu-24.04
    needs: python-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build FastAPI Docker image
        run: |
          docker build -f api/Dockerfile -t project1-feature-api:ci .

      - name: Build feature exporter Docker image
        run: |
          docker build -f monitoring/exporters/Dockerfile.feature_exporter -t project1-feature-freshness-exporter:ci .
